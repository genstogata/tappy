# Tappy via Docker — for an existing Cloudflare Tunnel setup.
#
# Tappy is a static site. This container serves files and holds no data:
# no database, no volume, no server-side state. Every class, roster and
# session lives in the browser on the teacher's device.
#
# The container is hardened to prove that: read-only root filesystem, all
# capabilities dropped, no privilege escalation, and a tmpfs for the few
# paths nginx wants to write to at startup.
#
# Usage:
#   docker compose up -d
#
# Then point your existing Cloudflare Tunnel at http://tappy:80 (see README).

services:
  tappy:
    # Pin the exact app version in production so a deploy never changes under
    # you. `latest` tracks the released version and `beta` the beta branch;
    # both move, so prefer a pinned tag like :v32 for a classroom device.
    # Available tags: https://hub.docker.com/r/af416/tappy/tags
    image: af416/tappy:v32
    # To build locally instead of pulling from Docker Hub, comment out `image:`
    # above and uncomment the next line (run from the repository root):
    # build:
    #   context: ..
    #   dockerfile: Dockerfile
    container_name: tappy
    restart: unless-stopped

    # No `ports:` on purpose. The Cloudflare Tunnel reaches this container over
    # the compose network, so nothing is published on the host and the app is
    # never exposed directly to the internet. Uncomment to test locally:
    # ports:
    #   - "127.0.0.1:8080:8080"

    # --- Hardening: the container cannot write anything, anywhere ----------
    # This works because the image runs nginx as an unprivileged user, so it
    # never needs to chown its cache directories (which cap_drop: ALL forbids).
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - tappy

networks:
  tappy:
    name: tappy
