# Tappy — static file server.
#
# This container serves files and nothing else: no database, no uploads, no
# server-side state, no writable volume. All student data lives in the browser
# (IndexedDB / localStorage) on the teacher's own device. See docker/README.md.

# Cache-Control is chosen per-path through a map so that every add_header lives
# in exactly one place. This matters: add_header inside a location block
# *replaces* the inherited set rather than adding to it, so scattering headers
# across locations would silently drop the security headers below.
map $uri $tappy_cache_control {
    default   "no-cache";
    ~^/icons/ "public, max-age=31536000, immutable";
}

server {
    # 8080, not 80: this image runs as an unprivileged user (UID 101) that
    # cannot bind a privileged port. That is deliberate — it lets the container
    # run with a read-only root filesystem and every capability dropped.
    listen      8080;
    listen      [::]:8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # No access log. Tappy is entirely client-side, so a request log would only
    # ever record who opened it and when — nothing here needs that, and this is
    # data about children's schools. Uncomment the line below to debug.
    access_log off;
    # access_log /dev/stdout;

    charset utf-8;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 512;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/manifest+json;

    # --- Security headers -------------------------------------------------
    # These are the main reason to self-host: GitHub Pages cannot set response
    # headers, so frame-ancestors / X-Frame-Options were impossible there.
    # index.html also carries a <meta> CSP; multiple policies are enforced
    # independently, so keeping both is safe and covers header-less hosts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # web-share is deliberately NOT listed. It gates navigator.share(), which is
    # the primary "save the CSV" path on iOS, and its default allowlist is
    # already `self` — so omitting it keeps sharing working. Declaring it
    # explicitly makes Chromium log "Unrecognized feature: 'web-share'".
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # The map above resolves to "no-cache" for the app shell (index.html,
    # app.js, styles.css, service-worker.js, manifest.json) so a deploy is
    # picked up immediately, and to a long immutable cache for icons.
    add_header Cache-Control $tappy_cache_control always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never serve dotfiles.
    location ~ /\. {
        deny all;
    }
}
