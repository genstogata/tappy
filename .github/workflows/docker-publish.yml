name: Publish Docker image

# Builds a multi-arch image (amd64 + arm64) and pushes it to Docker Hub.
# arm64 matters: a VPS may be Ampere/ARM, and Apple Silicon users may want to
# run it locally.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  — Docker Hub account name
#   DOCKERHUB_TOKEN     — Docker Hub access token (Account Settings -> Security)
#
# Tags produced:
#   latest            — on pushes to main
#   beta              — on pushes to the beta branch
#   v1.2.3, 1.2       — on git tags like v1.2.3
#   sha-<short>       — always

on:
  push:
    branches: [main, beta]
    tags: ["v*"]
  pull_request:
    branches: [main, beta]
  workflow_dispatch:

env:
  IMAGE_NAME: genstogata/tappy

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # On pull requests we build but do not push, so a broken Dockerfile is
      # caught before merge without needing registry credentials.
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke-test the image we just built, on the runner's own architecture.
      - name: Verify the image serves the app
        run: |
          docker build -t tappy:ci .
          docker run -d --name tappy-ci -p 8080:8080 \
            --read-only --tmpfs /var/cache/nginx --tmpfs /tmp \
            --security-opt no-new-privileges:true --cap-drop ALL tappy:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          for path in / /app.js /styles.css /service-worker.js /manifest.json /icons/icon-192.png; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done
          # The container must not have written anything: this is the guarantee
          # that no data is stored on the host.
          if [ -n "$(docker diff tappy-ci)" ]; then
            echo "ERROR: container wrote to its filesystem:"; docker diff tappy-ci; exit 1
          fi
          echo "OK: stateless, all assets served"
          docker rm -f tappy-ci
