name: Publish Docker image

# Builds a multi-arch image (amd64 + arm64) and pushes it to Docker Hub.
#
# VERSIONING — one source of truth
# --------------------------------
# The image tag comes from APP_VERSION in app.js, which is bumped with
#   scripts/bump-version.sh 31
# That script also updates CACHE_NAME in service-worker.js, so the app version,
# the service-worker cache version and the Docker tag can never drift apart.
#
# Tags produced for APP_VERSION = "v31":
#   latest      — only from the default branch (main), so `latest` always means
#                 "the released version"
#   beta        — from the beta branch, so beta testers get a moving target
#   v31         — the exact app version, on every branch. Pin this in
#                 production: it never moves.
#   sha-abc1234 — the exact commit, for debugging
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  — Docker Hub account name
#   DOCKERHUB_TOKEN     — Docker Hub access token (Account Settings -> Security)

on:
  push:
    branches: [main, beta]
    tags: ["v*"]
  pull_request:
    branches: [main, beta]
  workflow_dispatch:

env:
  IMAGE_NAME: af416/tappy

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fail fast if APP_VERSION and CACHE_NAME have drifted apart. A mismatch
      # means browsers would keep serving stale files, which is worse than a
      # failed build.
      - name: Verify version strings are in sync
        run: |
          APP=$(sed -n 's/.*APP_VERSION = "v\([0-9][0-9.]*\)".*/\1/p' app.js | head -1)
          CACHE=$(sed -n 's/.*CACHE_NAME = "tappy-cache-v\([0-9][0-9.]*\)".*/\1/p' service-worker.js | head -1)
          echo "app.js APP_VERSION       = v$APP"
          echo "service-worker CACHE_NAME = v$CACHE"
          if [ -z "$APP" ] || [ -z "$CACHE" ]; then
            echo "::error::Could not read a version from app.js or service-worker.js"
            exit 1
          fi
          if [ "$APP" != "$CACHE" ]; then
            echo "::error::Version mismatch: app.js is v$APP but service-worker.js is v$CACHE. Run scripts/bump-version.sh to fix."
            exit 1
          fi
          echo "VERSION=$APP" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # On pull requests we build but do not push, so a broken Dockerfile is
      # caught before merge without needing registry credentials.
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=v${{ env.VERSION }}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke-test the image we just built, on the runner's own architecture.
      - name: Verify the image serves the app
        run: |
          docker build -t tappy:ci .
          docker run -d --name tappy-ci -p 8080:8080 \
            --read-only --tmpfs /var/cache/nginx --tmpfs /tmp \
            --security-opt no-new-privileges:true --cap-drop ALL tappy:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          for path in / /app.js /styles.css /service-worker.js /manifest.json /icons/icon-192.png; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done
          # The served app must report the version we just tagged.
          served=$(curl -s http://127.0.0.1:8080/app.js | sed -n 's/.*APP_VERSION = "v\([0-9][0-9.]*\)".*/\1/p' | head -1)
          echo "served version: v$served (expected v$VERSION)"
          [ "$served" = "$VERSION" ] || { echo "::error::Served version v$served != expected v$VERSION"; exit 1; }
          # The container must not have written anything: this is the guarantee
          # that no data is stored on the host.
          if [ -n "$(docker diff tappy-ci)" ]; then
            echo "::error::Container wrote to its filesystem:"; docker diff tappy-ci; exit 1
          fi
          echo "OK: stateless, all assets served, version v$VERSION"
          docker rm -f tappy-ci
